<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kmetija Urška – Pogovori</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #8b6343; --bg: #f5f4f1; --card: #fff; --muted: #7a7a7a; --border: #e6e2da; --shadow: 0 10px 30px rgba(0,0,0,0.06); --radius: 14px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #1b1f1a; line-height: 1.6; padding-bottom: 32px; }
    .page { max-width: 1400px; margin: 0 auto; padding: 20px; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 18px 20px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; }
    .title { font-size: 1.3rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.95rem; }
    .btn { border: none; cursor: pointer; padding: 10px 14px; border-radius: 10px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; background: var(--brand); color: #fff; text-decoration: none; }
    .btn.secondary { background: #f1ede5; color: #4b3a28; box-shadow: none; }
    .card { background: var(--card); padding: 16px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
    .filters { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
    label { font-weight: 600; font-size: 13px; color: #3b2d1e; display:block; margin-bottom:4px; }
    select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0ede8; vertical-align: top; }
    th { color: #4b3a28; font-size: 13px; }
    .muted { color: var(--muted); font-size: 12px; }
    .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #f1ede5; color: #4b3a28; }
    .pill.warn { background: #fff4d6; color: #8a6500; }
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <div class="title">🌾 Kmetija Urška – Pogovori</div>
        <div class="subtitle">Pregled sej in vprašanj</div>
      </div>
      <div style="display:flex; gap:10px;">
        <a class="btn secondary" href="/admin">⬅ Nazaj</a>
        <button class="btn" id="refreshBtn">Osveži</button>
      </div>
    </header>
    <div class="card">
      <div class="filters">
        <div>
          <label for="limit">Število pogovorov</label>
          <select id="limit"><option value="100">100</option><option value="200" selected>200</option><option value="500">500</option></select>
        </div>
        <div><label>&nbsp;</label><button class="btn" id="loadBtn">Naloži</button></div>
      </div>
    </div>
    <div class="card">
      <div id="stats" class="muted"></div>
      <div style="overflow:auto; margin-top:8px;">
        <table>
          <thead><tr>
            <th class="nowrap">Session</th>
            <th class="nowrap">Sporočila</th>
            <th class="nowrap">Zadnji čas</th>
            <th>Zadnje vprašanje</th>
            <th class="nowrap">Intent</th>
            <th class="nowrap">Pogovor</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const API_BASE = '/api/admin';
    const tableBody = document.getElementById('tableBody');
    const limitEl = document.getElementById('limit');
    const statsEl = document.getElementById('stats');

    function escapeHtml(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function sessionDomId(s) { return String(s||'no-session').replace(/[^a-zA-Z0-9_-]/g,'_'); }

    async function loadSessionDetail(sessionId, targetEl) {
      const res = await fetch(`${API_BASE}/conversations/session/${encodeURIComponent(sessionId)}`);
      const data = await res.json();
      const list = data.conversations || [];
      if (!list.length) { targetEl.innerHTML = '<div class="muted">Ni pogovora.</div>'; return; }
      targetEl.innerHTML = list.map(item => `
        <div style="padding:8px 0; border-bottom:1px solid #f0ede8;">
          <div class="muted">${escapeHtml(item.created_at)} · ${escapeHtml(item.intent||'-')}</div>
          <div><strong>Uporabnik:</strong> ${escapeHtml(item.user_message)}</div>
          <div><strong>AI:</strong> ${escapeHtml(item.bot_response)}</div>
        </div>`).join('');
    }

    async function loadConversations() {
      const res = await fetch(`${API_BASE}/conversations?limit=${limitEl.value}`);
      const data = await res.json();
      const list = data.conversations || [];
      const stats = data.stats || {};
      statsEl.textContent = `Skupaj sporočil: ${stats.total || list.length}`;

      const sessions = {};
      list.forEach(item => {
        const sid = item.session_id || 'no-session';
        if (!sessions[sid]) sessions[sid] = { session_id: sid, messages: [], last: item };
        sessions[sid].messages.push(item);
        if ((item.created_at||'') > (sessions[sid].last.created_at||'')) sessions[sid].last = item;
      });

      const sessionList = Object.values(sessions).sort((a,b) => (b.last?.created_at||'').localeCompare(a.last?.created_at||''));

      tableBody.innerHTML = sessionList.map(s => {
        const domId = sessionDomId(s.session_id);
        const lastItem = s.last || {};
        const canView = s.session_id && s.session_id !== 'no-session';
        return `
          <tr>
            <td class="nowrap">${escapeHtml(s.session_id)}</td>
            <td class="nowrap">${s.messages.length}</td>
            <td class="nowrap">${escapeHtml(lastItem.created_at||'-')}</td>
            <td>${escapeHtml(lastItem.user_message||'-')}</td>
            <td class="nowrap"><span class="pill">${escapeHtml(lastItem.intent||'-')}</span></td>
            <td class="nowrap">${canView ? `<button class="btn secondary" data-session="${escapeHtml(s.session_id)}" data-target="${domId}">Poglej</button>` : '<span class="muted">-</span>'}</td>
          </tr>
          <tr id="detail-${domId}" style="display:none;">
            <td colspan="6"><div class="card" style="box-shadow:none;border:1px solid #f0ede8;margin:0;"><div class="muted">Nalagam...</div></div></td>
          </tr>`;
      }).join('');

      document.querySelectorAll('button[data-session][data-target]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const detailRow = document.getElementById(`detail-${btn.getAttribute('data-target')}`);
          if (!detailRow) return;
          if (detailRow.style.display !== 'none') { detailRow.style.display = 'none'; return; }
          detailRow.style.display = 'table-row';
          await loadSessionDetail(btn.getAttribute('data-session'), detailRow.querySelector('.card'));
        });
      });
    }

    document.getElementById('loadBtn').addEventListener('click', loadConversations);
    document.getElementById('refreshBtn').addEventListener('click', loadConversations);
    loadConversations();
  </script>
</body>
</html>
