<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Kmetija Urška AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
    :root {
      --bg: #f5f9f5;
      --card: #eef5ee;
      --text: #1a2e1a;
      --muted: #4a6b4a;
      --border: #c8dfc8;
      --green: #2d5a2d;
      --accent: #5a9a3a;
      --bot-bg: #e4f0e4;
      --user-bg: #ffffff;
      --bot-text: #1a2e1a;
    }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .container { display: flex; flex-direction: column; height: 100%; }
    .header {
      padding: 14px 16px;
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .header-icon {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-text h1 { font-size: 1rem; font-weight: 600; margin-bottom: 2px; color: #fff; }
    .header-text p { font-size: 0.75rem; color: rgba(255,255,255,0.75); }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .clear-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .clear-btn.secondary {
      background: rgba(255,255,255,0.1);
    }
    .clear-btn:hover { background: rgba(255,255,255,0.3); }
    .messages {
      flex: 1; overflow-y: auto; padding: 16px;
      background: #fff;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 16px;
      font-size: 0.9rem; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.user {
      margin-left: auto; background: var(--user-bg);
      color: var(--text); border: 1px solid var(--border);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      margin-right: auto; background: var(--bot-bg);
      color: var(--text); border-bottom-left-radius: 4px;
    }
    .msg.typing { background: var(--bot-bg); color: var(--bot-text); padding: 12px 18px; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span {
      width: 8px; height: 8px; background: var(--accent);
      border-radius: 50%; animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    .quick-btns {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 10px 16px 12px; background: #fff;
      border-top: 1px solid var(--border);
    }
    .quick-btn {
      padding: 6px 12px; border-radius: 20px;
      background: #fff; border: 1px solid var(--border);
      font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
      color: var(--green);
    }
    .quick-btn:hover {
      background: var(--card); border-color: var(--accent);
    }
    .input-area {
      padding: 12px 16px; background: var(--card);
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    .input-area textarea {
      flex: 1; min-height: 42px; max-height: 100px;
      padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 16px; font-family: inherit; font-size: 0.9rem;
      resize: none; outline: none; line-height: 1.4;
      background: #fff;
    }
    .input-area textarea:focus { border-color: var(--accent); }
    .input-area button {
      width: 42px; height: 42px; border-radius: 50%;
      border: none; background: var(--green); color: white;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.15s; flex-shrink: 0;
    }
    .input-area button:hover { background: var(--accent); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-area button svg { width: 20px; height: 20px; fill: currentColor; }
    .powered {
      padding: 8px; text-align: center; font-size: 0.7rem;
      color: var(--muted); background: var(--bg);
    }
    .powered a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">🌿</div>
      <div class="header-text">
        <h1>Kmetija Urška</h1>
        <p>Ekološka turistična kmetija • Stranice</p>
      </div>
      <div class="header-actions">
        <button class="clear-btn" id="clearBtn" title="Počisti pogovor">Počisti</button>
        <button class="clear-btn secondary" id="newSessionBtn" title="Nova seja">Nova seja</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="quick-btns" id="quickBtns">
      <button class="quick-btn" data-msg="Kaj ponujate na kmetiji?">🏡 Ponudba</button>
      <button class="quick-btn" data-msg="Kakšne so cene nastanitve?">💶 Cene</button>
      <button class="quick-btn" data-msg="Rad bi rezerviral sobo.">🛏️ Rezervacija sobe</button>
      <button class="quick-btn" data-msg="Kaj je v Hiši dobrega počutja?">🧖 Wellness</button>
      <button class="quick-btn" data-msg="Kakšni so vikend paketi?">🎁 Paketi</button>
    </div>
    <div class="input-area">
      <textarea id="input" placeholder="Napišite sporočilo..." rows="1"></textarea>
      <button id="sendBtn" aria-label="Pošlji">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="powered">built by: <a href="https://spoznaj-ai.si" target="_blank">spoznaj-ai.si</a></div>
  </div>

  <script>
    const STORAGE_KEY = 'urska_chat_history';
    const MAX_MESSAGES = 50;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const quickBtns = document.getElementById('quickBtns');
    const clearBtn = document.getElementById('clearBtn');
    const newSessionBtn = document.getElementById('newSessionBtn');

    function loadHistory() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const messages = JSON.parse(saved);
          if (messages.length > 0) {
            messages.forEach(m => addMessageToDOM(m.text, m.who, false));
            quickBtns.style.display = 'none';
            return true;
          }
        }
      } catch (e) {}
      return false;
    }

    function saveHistory() {
      try {
        const messages = [];
        document.querySelectorAll('.msg:not(.typing)').forEach(el => {
          messages.push({ text: el.textContent, who: el.classList.contains('user') ? 'user' : 'bot' });
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-MAX_MESSAGES)));
      } catch (e) {}
    }

    function clearHistory() {
      localStorage.removeItem(STORAGE_KEY);
      messagesEl.innerHTML = '';
      addMessageToDOM('Pozdravljeni! 🌿 Sem vaš pomočnik Kmetije Urška. Kako vam lahko pomagam?', 'bot', false);
      quickBtns.style.display = 'flex';
    }

    function addMessageToDOM(text, who, save = true) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messagesEl.appendChild(div);
      if (who === 'user') {
        div.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (save) saveHistory();
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg bot typing';
      div.id = 'typing';
      div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(div);
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    const sessionKey = 'urska_session_id';
    let sessionId = localStorage.getItem(sessionKey);
    if (!sessionId) {
      sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      localStorage.setItem(sessionKey, sessionId);
    }

    function resetSession() {
      localStorage.removeItem(sessionKey);
      sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
      localStorage.setItem(sessionKey, sessionId);
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      addMessageToDOM(text, 'user');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
      quickBtns.style.display = 'none';
      showTyping();
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });
        hideTyping();
        if (res.ok) {
          const data = await res.json();
          addMessageToDOM(data.reply || 'Oprostite, prišlo je do napake.', 'bot');
        } else {
          addMessageToDOM('Oprostite, strežnik ni dosegljiv.', 'bot');
        }
      } catch (err) {
        hideTyping();
        addMessageToDOM('Oprostite, prišlo je do napake pri povezavi.', 'bot');
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
    clearBtn.addEventListener('click', clearHistory);
    newSessionBtn.addEventListener('click', () => { clearHistory(); resetSession(); });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(inputEl.value); }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => { sendMessage(btn.dataset.msg); });
    });

    const hasHistory = loadHistory();
    if (!hasHistory) {
      addMessageToDOM('Pozdravljeni! 🌿 Sem vaš pomočnik Kmetije Urška. Kako vam lahko pomagam?', 'bot', false);
    }
  </script>
</body>
</html>
